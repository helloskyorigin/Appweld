name: Finalize Appweld landing
on:
  push:
    paths:
      - ".appweld-import.b64"
      - ".github/workflows/finalize-appweld.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand verified Appweld source
        shell: bash
        run: |
          set -euo pipefail
          test -s .appweld-import.b64
          base64 --decode .appweld-import.b64 > /tmp/appweld.tar.xz
          tar -tJf /tmp/appweld.tar.xz
          tar -xJf /tmp/appweld.tar.xz -C .
          test -s index.html
          test -s styles.css
          test -s script.js
          test -s create/index.html
          test -s firebase.json
          rm .appweld-import.b64
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: deliver complete Appweld landing and no-login preview"
          git push origin HEAD:main
